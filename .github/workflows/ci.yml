name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      # Report every platform, even when one fails.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features desktop -- -D warnings
      # Run every test group even after one fails, so each run reports every failure.
      - run: cargo test --locked --features desktop --no-fail-fast
      - run: cargo build --locked --release --features desktop
      - uses: actions/upload-artifact@v4
        with:
          name: k3up-${{ runner.os }}
          path: |
            target/release/k3up
            target/release/k3up.exe
            target/release/k3up-agent
            target/release/k3up-agent.exe
            target/release/k3up-desktop
            target/release/k3up-desktop.exe
  minimum-rust:
    # Keeps the rust-version in Cargo.toml honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo check --locked --all-targets --features desktop
